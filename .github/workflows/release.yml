name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: |
          bun run build:chrome
          bun run build:firefox
          bun run build:edge

      - name: Read package name and package files
        id: meta
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create zip archive
        run: |
          for BROWSER in chrome firefox edge; do
            ZIP_NAME="${{ steps.meta.outputs.pkg_name }}-${BROWSER}.zip"
            (cd "dist/${BROWSER}" && zip -r "../../${ZIP_NAME}" .)
            echo "Created archive: ${ZIP_NAME}"
          done

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.pkg_name }}-chrome.zip
            ${{ steps.meta.outputs.pkg_name }}-firefox.zip
            ${{ steps.meta.outputs.pkg_name }}-edge.zip

      - name: Write changelog
        run: npx changelogithub # or changelogithub@0.12 to ensure a stable result
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
